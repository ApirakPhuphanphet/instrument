<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ES-Hub · Instrument & User Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Core & Shared Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Module-specific Styles -->
  <link rel="stylesheet" href="modules/dashboard/dashboard.css">
  <link rel="stylesheet" href="modules/instruments/instruments.css">
  <link rel="stylesheet" href="modules/users/users.css">
</head>
<body>

  <!-- ── Sidebar ── -->
  <aside id="sidebar">
    <!-- Brand -->
    <div style="height: var(--header-h); display: flex; align-items: center; padding: 0 16px; gap: 10px; border-bottom: 1px solid var(--border); flex-shrink: 0;">
      <div style="width: 26px; height: 26px; border-radius: 6px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #fff;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>
        </svg>
      </div>
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span style="font-weight: 700; font-size: 14px; letter-spacing: 0.02em; color: var(--text);">ES-Hub</span>
        <span class="mono" style="font-size: 9.5px; font-weight: 600; padding: 1px 5px; border-radius: 3px; background: var(--accent-bg); color: var(--accent);">API</span>
      </div>
    </div>

    <!-- Nav list -->
    <nav style="padding: 12px 8px; flex: 1; overflow-y: auto;">
      <div class="nav-item active" onclick="navigate('dashboard')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Dashboard</span>
      </div>
      <div class="nav-item" onclick="navigate('instruments')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        <span>Instruments</span>
      </div>
      <div class="nav-item" onclick="navigate('users')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Users</span>
      </div>
    </nav>

    <!-- Sidebar Bottom Status -->
    <div style="padding: 12px 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text3);">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
        <span>API Server</span>
        <span id="api-status-badge" style="display: inline-flex; align-items: center; gap: 5px; color: var(--green); font-weight: 500;">
          <span style="width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block;"></span>
          Online
        </span>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <span>Backend Host</span>
        <span class="mono" id="api-host-display" style="color: var(--text2); font-size: 10px;">:3000</span>
      </div>
    </div>
  </aside>

  <!-- ── Main Content Area ── -->
  <div id="main">
    <!-- Header -->
    <header id="header">
      <span id="page-title" style="font-size: 13.5px; font-weight: 600; color: var(--text);">Dashboard</span>
      <div style="flex: 1;"></div>

      <!-- Quick Search input -->
      <div style="position: relative; width: 260px;">
        <svg style="position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="global-search" placeholder="Search instruments or users..." style="width: 100%; height: 30px; padding: 0 10px 0 30px; font-size: 12px;">
      </div>

      <!-- Theme Switcher -->
      <button class="btn" style="padding: 6px;" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
        <svg id="theme-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>

      <!-- API Settings Modal trigger -->
      <button class="btn" style="padding: 6px;" onclick="openModal('api-config-modal')" title="Configure API Host">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Content Pages Container (Modules injected dynamically) -->
    <main id="content">
      <div id="module-loading" style="text-align: center; padding: 48px 16px; color: var(--text3);">
        Loading application modules...
      </div>
    </main>
  </div>

  <!-- ── MODAL: API Config ── -->
  <div class="modal-overlay" id="api-config-modal" onclick="closeModalOnBackdrop(event, 'api-config-modal')">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="font-size: 14px; font-weight: 600; color: var(--text);">Backend API Settings</h3>
        <button class="btn btn-sm" onclick="closeModal('api-config-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <div>
          <label style="display: block; font-size: 11.5px; font-weight: 600; color: var(--text2); margin-bottom: 5px;">API Base URL</label>
          <input id="setting-api-url" class="mono" style="width: 100%;">
          <div style="font-size: 11px; color: var(--text3); margin-top: 5px;">
            Default is <code class="mono">http://localhost:3000</code> or relative URL when served directly by backend.
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal('api-config-modal')">Cancel</button>
        <button class="btn btn-primary" onclick="saveApiUrl()">Save & Reconnect</button>
      </div>
    </div>
  </div>

  <!-- Container for dynamically mounted module modals -->
  <div id="modal-container"></div>

  <!-- Global Toast Notifications Container -->
  <div id="toast-container"></div>

  <!-- ── Application Scripts ── -->
  <script src="js/app.js"></script>
  <script src="modules/dashboard/dashboard.js"></script>
  <script src="modules/instruments/instruments.js"></script>
  <script src="modules/users/users.js"></script>
</body>
</html>
