<!-- ════════════════════════════════════════════════════════════════════
     PAGE: RFID REGISTRY
     ════════════════════════════════════════════════════════════════════ -->
<section id="page-rfid" style="display: none;">
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 18px;">
    <!-- Register Tag Card -->
    <div class="card">
      <h3 style="font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 12px;">Register RFID Tag</h3>
      <p style="font-size: 12px; color: var(--text2); margin-bottom: 16px;">
        Write or upsert RFID hardware identifiers to the database (<code class="mono">POST /LF</code> or <code class="mono">POST /HF</code>).
      </p>

      <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;">
        <div>
          <label style="display: block; font-size: 11.5px; font-weight: 600; color: var(--text2); margin-bottom: 5px;">RFID Type</label>
          <select id="rfid-register-type" style="width: 100%;">
            <option value="LF">LF (Low Frequency - 125kHz, used for User Cards)</option>
            <option value="HF">HF (High Frequency - 13.56MHz, used for Instruments)</option>
          </select>
        </div>

        <div>
          <label style="display: block; font-size: 11.5px; font-weight: 600; color: var(--text2); margin-bottom: 5px;">Tag UID Hex</label>
          <input id="rfid-register-id" class="mono" placeholder="e.g. EA05B4CC or ACCEC600" style="width: 100%;">
        </div>
      </div>

      <button class="btn btn-primary" style="width: 100%;" onclick="submitRfidRegister()">Register Tag</button>
    </div>

    <!-- Check Tag Card -->
    <div class="card">
      <h3 style="font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 12px;">Check RFID Tag Connection</h3>
      <p style="font-size: 12px; color: var(--text2); margin-bottom: 16px;">
        Verify whether an RFID tag is currently assigned to an active user or instrument.
      </p>

      <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;">
        <div>
          <label style="display: block; font-size: 11.5px; font-weight: 600; color: var(--text2); margin-bottom: 5px;">RFID Type</label>
          <select id="rfid-check-type" style="width: 100%;">
            <option value="LF">LF (User Cards)</option>
            <option value="HF">HF (Instrument Tags)</option>
          </select>
        </div>

        <div>
          <label style="display: block; font-size: 11.5px; font-weight: 600; color: var(--text2); margin-bottom: 5px;">Tag UID Hex</label>
          <input id="rfid-check-id" class="mono" placeholder="Enter tag to verify..." style="width: 100%;">
        </div>
      </div>

      <button class="btn" style="width: 100%;" onclick="submitRfidCheck()">Check Tag Status</button>

      <div id="rfid-check-status-result"></div>
    </div>
  </div>
</section>
